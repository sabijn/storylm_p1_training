architecture: gpt2

# Common size fields map onto GPT2Config's n_embd/n_inner/n_head/n_layer/n_positions.
# Sizes below follow the 20M row in the README's model-size table.
model:
  hidden_size: 384
  intermediate_size: 768
  num_attention_heads: 6
  num_hidden_layers: 6
  max_position_embeddings: 256
  extra:
    resid_pdrop: 0.1
    embd_pdrop: 0.1
    attn_pdrop: 0.1

tokenizer:
  path: /scratch-shared/sperdijk/storylm_p1_training/tokenizers/tokenizer_16k_nl

data:
  config: data_base.yaml   # resolved relative to this file's directory

training:
  output_dir: /scratch-shared/sperdijk/storylm_p1_training/models/base_gpt2_20m_16k
  num_train_epochs: 5
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 3
  logging_steps: 50
  seed: 359
  bf16: true

wandb:
  entity: sabijn-leiden-university
  project: storytimelm-pretraining
  run_name: base_gpt2_20m_tok_16k
  tags: [base, gpt2, 20m, tok_16k]
