# A different dataset than data_base.yaml, used for continued pretraining of the base model.
sources:
  - name: chiscor
    type: csv
    path: /local/perdijks/datasets/ChiSCor_master_df.csv
    text_column: story_raw

split:
  dev_fraction: 0.05
  test_fraction: 0.05
  seed: 42

paths:
  output_dir: /local/perdijks/storylm_pipeline/data/continued_chiscor
