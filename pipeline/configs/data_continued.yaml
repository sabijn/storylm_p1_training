# A different dataset than data_base.yaml, used for continued pretraining of the base model.
sources:
  # - name: StoriesFTW
  #   type: hf
  #   hf_name: Sabijn/StoriesfortheWin
  #   split: train
  #   text_column: story

  # SoNaR-500 subset. Requires running scripts/prepare_sonar.py once first (see
  # configs/sonar_extract.yaml) to produce the `path` below. Uncomment `categories` (SoNaR
  # text-type codes, e.g. WR-P-P-B=books, WS-U-E-A=autocues - full list in
  # scripts/prepare_sonar.py's CATEGORY_NAMES) to restrict which categories to draw from.
  # Set at most one of: sample_words (whitespace word count budget - a tokenizer-agnostic
  # proxy for a token budget; divide your target token count by the tokenizer's fertility,
  # e.g. ~1.2 for the 16k/32k tokenizers per the fertility analysis in test_and_check.ipynb,
  # to get sample_words), sample_fraction, sample_size (document count). Omit all three to
  # use every (category-filtered) document as-is.
  - name: SoNaR
    type: local
    path: /scratch-shared/sperdijk/storylm_p1_training/data/sonar_extracted
    text_column: text
    # categories: [WR-P-P-B, WS-U-E-A]
    sample_words: 120000000
    # sample_fraction: 0.1
    # sample_size: 100000
    seed: 42

split:
  dev_fraction: 0.05
  test_fraction: 0.05
  seed: 42

paths:
  output_dir: /scratch-shared/sperdijk/storylm_p1_training/data/continue_sonar_prepared
