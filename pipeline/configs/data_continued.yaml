# A different dataset than data_base.yaml, used for continued pretraining of the base model.
sources:
  # - name: StoriesFTW
  #   type: hf
  #   hf_name: Sabijn/StoriesfortheWin
  #   split: train
  #   text_column: story

  # SoNaR-500 subset. Requires running scripts/prepare_sonar.py once first (see
  # configs/sonar_extract.yaml) to produce the `path` below. Uncomment `categories` (SoNaR
  # text-type codes, e.g. WR-P-P-B=books, WS-U-E-A=autocues - full list in
  # scripts/prepare_sonar.py's CATEGORY_NAMES) to restrict which categories to draw from.
  # Set at most one of: sample_tokens (exact token budget - requires tokenizer_path, the
  # tokenizer to count with), sample_words (whitespace word count - a cheaper but only
  # approximate proxy for a token budget), sample_fraction, sample_size (document count).
  # Omit all four to use every (category-filtered) document as-is.
  # - name: SoNaR
  #   type: local
  #   path: /scratch-shared/sperdijk/storylm_p1_training/data/sonar_extracted
  #   text_column: text
  #   # categories: [WR-P-P-B, WS-U-E-A]
  #   sample_tokens: 122000000
  #   tokenizer_path: /scratch-shared/sperdijk/storylm_p1_training/models/continued_StoriesFTW_gpt2_60m_16k_basepoch1_allblimp/milestone-2000M
  #   # sample_fraction: 0.1
  #   # sample_size: 100000
  #   seed: 42

  # Dutch Project Gutenberg. Requires running scripts/prepare_gutenberg.py once first (see
  # configs/gutenberg_extract.yaml) to produce the `path` below. Set at most one of
  # sample_tokens (requires tokenizer_path), sample_words, sample_fraction, sample_size -
  # see the `local` source type in src/data/sources.py. Omit all four to use every document.
  # - name: gutenberg_nl
  #   type: local
  #   path: /scratch-shared/sperdijk/storylm_p1_training/data/gutenberg_nl_extracted
  #   text_column: text
  #   seed: 42

  # CGN (Corpus Gesproken Nederlands) spoken-Dutch transcripts. Requires running
  # scripts/prepare_cgn.py once first (see configs/cgn_extract.yaml) to produce the `path`
  # below. Uncomment `categories` (CGN component codes, e.g. comp-k=news broadcast,
  # comp-o=read speech - full list in scripts/prepare_cgn.py's COMPONENT_NAMES) to restrict
  # which registers to draw from. Set at most one of sample_tokens (requires
  # tokenizer_path), sample_words, sample_fraction, sample_size - see the `local` source
  # type in src/data/sources.py. Omit all four to use every document.
  # - name: cgn_nl
  #   type: local
  #   path: /Users/sabijn/Documents/PhD/Datasets/cgn_nl_extracted
  #   text_column: text
  #   # categories: [comp-k, comp-o]
  #   seed: 42
  - name: babylm_nl
    type: hf
    hf_name: "BabyLM-community/babylm-nld"
    split: train
    text_column: text

split:
  dev_fraction: 0.05
  test_fraction: 0.05
  seed: 42

paths:
  output_dir: /scratch-shared/sperdijk/storylm_p1_training/data/base_pretrain
