# Data used to pretrain the base model from scratch, and (by default) to train the tokenizer.
sources:
  - name: babylm_nl
    type: hf
    hf_name: "BabyLM-community/babylm-nld"
    split: train
    text_column: text

  # Dutch Project Gutenberg. Requires running scripts/prepare_gutenberg.py once first (see
  # configs/gutenberg_extract.yaml) to produce the `path` below. Set at most one of
  # sample_tokens (requires tokenizer_path), sample_words, sample_fraction, sample_size -
  # see the `local` source type in src/data/sources.py. Omit all four to use every document.
  # - name: gutenberg_nl
  #   type: local
  #   path: /scratch-shared/sperdijk/storylm_p1_training/data/gutenberg_nl_extracted
  #   text_column: text
  #   seed: 42

  # CGN (Corpus Gesproken Nederlands) spoken-Dutch transcripts. Requires running
  # scripts/prepare_cgn.py once first (see configs/cgn_extract.yaml) to produce the `path`
  # below. Uncomment `categories` (CGN component codes, e.g. comp-k=news broadcast,
  # comp-o=read speech - full list in scripts/prepare_cgn.py's COMPONENT_NAMES) to restrict
  # which registers to draw from. Set at most one of sample_tokens (requires
  # tokenizer_path), sample_words, sample_fraction, sample_size - see the `local` source
  # type in src/data/sources.py. Omit all four to use every document.
  # - name: cgn_nl
  #   type: local
  #   path: /Users/sabijn/Documents/PhD/Datasets/cgn_nl_extracted
  #   text_column: text
  #   # categories: [comp-k, comp-o]
  #   seed: 42

split:
  dev_fraction: 0.05
  test_fraction: 0.05
  seed: 42

paths:
  output_dir: /scratch-shared/sperdijk/storylm_p1_training/data/base_pretrain
