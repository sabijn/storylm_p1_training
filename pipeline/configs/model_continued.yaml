# Loads a saved base model and continues pretraining it on data_continued.yaml.
# base_model:
#   path: /scratch-shared/sperdijk/storylm_p1_training/models/base_gpt2_60m_16k_epoch1/final
#   tokenizer_path: /scratch-shared/sperdijk/storylm_p1_training/models/base_gpt2_60m_16k_epoch1/final

# Alternative to `base_model:` above — omit `base_model:` and uncomment this instead to start
# from a freshly-initialized model.
architecture: gpt2
model:
  hidden_size: 512
  intermediate_size: 1024
  num_attention_heads: 8
  num_hidden_layers: 16
  max_position_embeddings: 256
  extra: {resid_pdrop: 0.1, embd_pdrop: 0.1, attn_pdrop: 0.1}
tokenizer:
  path: /scratch-shared/sperdijk/storylm_p1_training/tokenizers/tokenizer_16k_nl

data:
  config: data_continued.yaml   # resolved relative to this file's directory

training:
  output_dir: /scratch-shared/sperdijk/storylm_p1_training/models/scratch_storiesftw_gpt2_60m_16k
  num_train_epochs: 25
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  save_total_limit: 3
  load_best_model_at_end: false
  metric_for_best_model: eval_loss
  greater_is_better: false
  logging_steps: 20
  seed: 359
  bf16: true

wandb:
  entity: sabijn-leiden-university
  project: storytimelm-pretraining
  run_name: scratch_storiesftw_gpt2_60m_16k
  tags: [scratch, storiesftw, gpt2, 60m, 16k]

milestones:
  token_milestones_millions: [25, 50, 75, 100, 250, 500, 750, 1000, 1250, 1500, 1750, 2000]


tasks:
  blimp_nl:
    normalize_by_length: true
  # --- zero-shot ---
  hellaswag_nl: {}
  storycloze_nl: {}
  belebele_nl: {}
  xcomps_nl: {}
  crows_pairs_nl: {}
  copanl: {}
  # --- finetune (each trains a fresh throwaway classification/QA head) ---
  sib200: {}
  sicknl: {}
  squadnl:
    num_train_epochs: 2
