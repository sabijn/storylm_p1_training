  tokenizer_path: /scratch-shared/sperdijk/storylm_p1_training/models/scratch_storiesftw_gpt2_60m_16k/milestone-2000M

data:
  config: data_continued.yaml   # resolved relative to this file's directory
  split: test                    # dev | test

